[package]
name = "satellites-images"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Asynchronous STAC satellite imagery metadata discovery and availability client"
license = "MIT"
repository = "https://github.com/powerpuff-kitty/satellites-images"
readme = "README.md"
keywords = ["satellite", "imagery", "stac", "earth-observation"]
categories = ["api-bindings", "science"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
regex = "1"
roxmltree = "0.20"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
