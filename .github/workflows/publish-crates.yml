name: Publish crates.io

# Publish only on an explicit version tag. Never on ordinary pushes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify only (do not publish)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Test
        run: cargo test --manifest-path crates/satellites-images/Cargo.toml
      - name: Guard tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(cargo metadata --manifest-path crates/satellites-images/Cargo.toml --no-deps --format-version 1 | python3 -c "import json,sys;print(json.load(sys.stdin)['packages'][0]['version'])")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $tag does not match crate version $pkg" >&2
            exit 1
          fi
      - name: Package (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: cargo package --manifest-path crates/satellites-images/Cargo.toml
      - name: Publish
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --manifest-path crates/satellites-images/Cargo.toml
