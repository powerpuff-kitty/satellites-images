name: Publish npm

# Publish only on an explicit version tag. Never on ordinary pushes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify only (do not publish)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Verify TypeScript package
        run: |
          npm run check
          npm pack --dry-run -w @powerpuff-kitty/satellites-images
      - name: Guard tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/typescript/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi
      - name: Publish (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish -w @powerpuff-kitty/satellites-images --access public --provenance --dry-run
      - name: Publish
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        # Trusted publishing: configure this repository/workflow as a trusted publisher
        # on npmjs.com; the OIDC token (id-token: write) authenticates the publish. No
        # long-lived NPM_TOKEN secret is used.
        run: npm publish -w @powerpuff-kitty/satellites-images --access public --provenance
