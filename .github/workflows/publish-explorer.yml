name: Publish Explorer (manual)

on:
  workflow_dispatch:
    inputs:
      esa_proxy_url:
        description: 'Optional HTTPS URL of the restricted ESA proxy Worker'
        required: false
        type: string

concurrency:
  group: satellites-images-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Validate optional proxy origin
        env:
          ESA_PROXY_URL: ${{ inputs.esa_proxy_url }}
        run: |
          node -e 'const value=process.env.ESA_PROXY_URL;if(value&&new URL(value).protocol!=="https:")process.exit(1)'
      - name: Build and typecheck explorer
        env:
          VITE_ESA_PROXY_URL: ${{ inputs.esa_proxy_url }}
        run: npm run check
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/explorer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish manually reviewed Explorer build
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
