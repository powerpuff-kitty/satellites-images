name: Publish Explorer (manual)

on:
  workflow_dispatch:
    inputs:
      esa_proxy_url:
        description: 'Optional HTTPS URL of the restricted ESA proxy Worker'
        required: false
        type: string

concurrency:
  group: satellites-images-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Validate optional proxy origin
        env:
          ESA_PROXY_URL: ${{ inputs.esa_proxy_url }}
        run: |
          node -e 'const value=process.env.ESA_PROXY_URL;if(value&&new URL(value).protocol!=="https:")process.exit(1)'
      - name: Build and typecheck explorer
        env:
          VITE_ESA_PROXY_URL: ${{ inputs.esa_proxy_url }}
        run: npm run check
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/explorer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish manually reviewed Explorer build
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
