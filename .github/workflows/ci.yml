name: CI
on:
  push:
  pull_request:
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm pack --dry-run -w @powerpuff-kitty/satellites-images
      - run: git diff --exit-code -- packages/typescript/src/sources.json packages/python/src/satellites_images/sources.json crates/satellites-images/src/sources.json
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e packages/python
      - run: python -m unittest discover -s packages/python/tests -v
      - run: python -m pip wheel --no-deps --wheel-dir /tmp/satellites-wheels packages/python
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path crates/satellites-images/Cargo.toml
      - run: cargo package --manifest-path crates/satellites-images/Cargo.toml --list --allow-dirty
  explorer-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright browser
        working-directory: apps/explorer
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E with offline fixtures
        run: npm run test:e2e -w @satellites-images/explorer
