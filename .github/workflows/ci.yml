name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Install and verify the packed npm candidate
        run: npm run check:packages -- --only typescript
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-candidate-node-${{ matrix.node }}
          path: dist/release-candidate/
      - run: git diff --exit-code -- packages/typescript/src/sources.json packages/python/src/satellites_images/sources.json crates/satellites-images/src/sources.json
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: python -m pip install -e packages/python
      - run: python -m unittest discover -s packages/python/tests -v
      - name: Install and verify the wheel and source distribution
        run: npm run check:packages -- --only python
        env:
          PYTHON: python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-candidate-${{ matrix.python }}
          path: dist/release-candidate/
  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.88.0", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: cargo fmt --manifest-path crates/satellites-images/Cargo.toml --check
      - run: cargo test --locked --manifest-path crates/satellites-images/Cargo.toml
      - run: cargo clippy --locked --manifest-path crates/satellites-images/Cargo.toml --all-targets -- -D warnings
      - name: Install and verify the packaged crate
        run: npm run check:packages -- --only rust
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-candidate-${{ matrix.rust }}
          path: dist/release-candidate/
  explorer-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright browser
        working-directory: apps/explorer
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E with offline fixtures
        run: npm run test:e2e -w @satellites-images/explorer
        env:
          LIVE: ""
