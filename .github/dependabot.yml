version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # npm: this repository is an npm workspace (root package.json declares
  # workspaces: packages/typescript, apps/explorer), so a single root entry updates the one
  # committed package-lock.json that covers every workspace member. Adding separate entries
  # for the members produces lockfile-desynchronised PRs that fail `npm ci`.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "pip"
    directory: "/packages/python"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/crates/satellites-images"
    schedule:
      interval: "weekly"
